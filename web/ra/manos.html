<style>

    box-shadow: 0 2px 6px rgba(0,0,0,.35); }

  #rec { position: fixed; z-index: 6; right: 72px; top: calc(50% + 33px); transform: translateY(-50%); display: none; white-space: nowrap;

  .tarjeta { width: 100%; max-width: 420px; padding: 18px; border-radius: 18px; background: var(--fondo); box-shadow: 0 6px 20px rgba(0,0,0,.35); }

<script type="module">
import * as THREE from 'three';

// ============================================================ Configuración
const MEDIAPIPE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35';
const params = new URLSearchParams(location.search);
const MODELO_MANOS = params.get('modelo') ||
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

// Aspecto de cada elemento (color CPK, radio en Å para dibujar, si la etiqueta va en blanco)
const ELEMENTOS = {
  H: { color: 0xF5F5F5, radio: 0.27 }, C: { color: 0x404040, radio: 0.36, clara: true },
  N: { color: 0x3050F8, radio: 0.37, clara: true }, O: { color: 0xE53935, radio: 0.39, clara: true },
  F: { color: 0x7CD13A, radio: 0.36 }, Cl: { color: 0x1FBF3F, radio: 0.45 }, Br: { color: 0xA62929, radio: 0.48, clara: true },
  I: { color: 0x940094, radio: 0.52, clara: true }, S: { color: 0xF2C200, radio: 0.46 }, P: { color: 0xFF8000, radio: 0.45 },
  B: { color: 0xFFB5B5, radio: 0.38 }, Si: { color: 0xF0C8A0, radio: 0.47 }, Na: { color: 0xAB5CF2, radio: 0.55, clara: true },
};
const aspecto = (el) => ELEMENTOS[el] || { color: 0xFF1493, radio: 0.4, clara: true };

// Energías de enlace promedio (kJ/mol). Clave: símbolos en orden alfabético + orden (1 simple, 2 doble, 3 triple)
const ENERGIAS = {
  'H-H1': 436, 'C-H1': 413, 'H-N1': 391, 'H-O1': 463, 'F-H1': 567, 'Cl-H1': 431, 'Br-H1': 366, 'H-I1': 299, 'H-S1': 339,
  'H-P1': 322, 'H-Si1': 323, 'C-C1': 348, 'C-C2': 614, 'C-C3': 839, 'C-N1': 293, 'C-N2': 615, 'C-N3': 891,
  'C-O1': 358, 'C-O2': 745, 'C-O3': 1072, 'C-F1': 485, 'C-Cl1': 339, 'Br-C1': 285, 'C-I1': 213, 'C-S1': 259, 'C-S2': 573,
  'N-N1': 163, 'N-N2': 418, 'N-N3': 945, 'N-O1': 201, 'N-O2': 607, 'O-O1': 146, 'O-O2': 498, 'Cl-Cl1': 242,
  'F-F1': 155, 'Br-Br1': 193, 'I-I1': 151, 'O-S2': 523, 'O-Si1': 452, 'O-P1': 335, 'O-P2': 544,
};
const ALFA = { 1: 2.2, 2: 2.6, 3: 2.9 }; // Å⁻¹: forma de la curva de Morse según el orden del enlace
const SIMBOLO_ORDEN = { 1: '–', 2: '=', 3: '≡' };

// ============================================================ Utilidades
const $ = (id) => document.getElementById(id);
const num = (x, d = 2) => x.toFixed(d).replace('.', ',');
let temporizadorAviso = 0;
function avisar(texto, ms = 1600) {
  const el = $('aviso');
  el.textContent = texto;
  el.classList.add('ver');
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => el.classList.remove('ver'), ms);
}
const estado = (t) => { const e = $('estado'); e.textContent = t; e.style.display = t ? '' : 'none'; };
estado('');
function fallo(titulo, texto) {
  $('introTitulo').textContent = titulo;
  $('introSub').textContent = texto;
  $('btnEmpezar').remove();
}

// ============================================================ Lectura del archivo .sdf / .mol (formato V2000)
function leerSDF(texto) {
  const l = texto.replace(/\r/g, '').split('\n');
  const conteo = l[3] || '';
  if (/V3000/.test(conteo)) throw new Error('El archivo está en formato V3000; guárdalo como V2000 (SDF de PubChem).');
  const na = parseInt(conteo.slice(0, 3)), nb = parseInt(conteo.slice(3, 6));
  if (!(na > 0)) throw new Error('El archivo no parece un .sdf válido.');
  const atomos = [], enlaces = [];
  for (let i = 0; i < na; i++) {
    const s = l[4 + i];
    const el = s.slice(31, 34).trim();
    atomos.push({ el: el.charAt(0).toUpperCase() + el.slice(1).toLowerCase(), x: +s.slice(0, 10), y: +s.slice(10, 20), z: +s.slice(20, 30) });
  }
  for (let i = 0; i < nb; i++) {
    const s = l[4 + na + i];
    const a = parseInt(s.slice(0, 3)) - 1, b = parseInt(s.slice(3, 6)) - 1, orden = parseInt(s.slice(6, 9));
    enlaces.push({ a, b, orden: [1, 2, 3].includes(orden) ? orden : 1 });
  }
  return { nombre: (l[0] || '').trim(), atomos, enlaces };
}

// ============================================================ Escena 3D (cámara ortográfica: 1 unidad = 1 Å)
const lienzo = $('escena');
const render = new THREE.WebGLRenderer({ canvas: lienzo, alpha: true, antialias: true });
render.setPixelRatio(Math.min(devicePixelRatio, 2));
const escena = new THREE.Scene();
const camara = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
camara.position.set(0, 0, 30);
escena.add(new THREE.AmbientLight(0xffffff, 0.75));
const luz = new THREE.DirectionalLight(0xffffff, 1.6);
luz.position.set(-3, 5, 8);
escena.add(luz);

let W = 0, H = 0, pxPorA = 100, mitadW = 1, mitadH = 1, anchoVista = 5.2, zoom = 1;
const ZOOM_MIN = 0.5, ZOOM_MAX = 2.5;
function ajustarEscala() {
  pxPorA = (Math.min(W, H) / anchoVista) * zoom;
  mitadW = W / 2 / pxPorA; mitadH = H / 2 / pxPorA;
  Object.assign(camara, { left: -mitadW, right: mitadW, top: mitadH, bottom: -mitadH });
  camara.updateProjectionMatrix();
}
function medir() {
  W = innerWidth; H = innerHeight;
  render.setSize(W, H, false);
  ajustarEscala();
  const c = $('manos'); c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
  const g = $('grafica'); g.width = g.clientWidth * devicePixelRatio; g.height = g.clientHeight * devicePixelRatio;
}
const aMundo = (x, y) => ({ x: (x - W / 2) / pxPorA, y: -(y - H / 2) / pxPorA });
const aPantalla = (p) => ({ x: W / 2 + p.x * pxPorA, y: H / 2 - p.y * pxPorA });

let zona = { xMin: -1, xMax: 1, yMin: -1, yMax: 1 };
function calcularZona() {
  const panel = $('panel');
  const abajo = panel.classList.contains('oculto') ? H : panel.getBoundingClientRect().top;
  zona = { xMin: -mitadW, xMax: mitadW, yMin: aMundo(0, abajo).y, yMax: aMundo(0, $('barra').getBoundingClientRect().bottom).y };
}
const centroLibre = () => aMundo(W / 2, ($('barra').getBoundingClientRect().bottom + 30 + $('panel').getBoundingClientRect().top) / 2);

// ============================================================ Molécula
let atomos = [], enlaces = [], angulos = [], original = null;
let ancla = 0;     // único átomo fijo (salvo que lo agarren): el de más enlaces, el más cercano al centro
let reposo = [];   // forma de la molécula en reposo (gira y se traslada junto con ella)
const morse = (e, r) => e.De * (1 - Math.exp(-e.alfa * (r - e.re))) ** 2;
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z });
const largo = (v) => Math.hypot(v.x, v.y, v.z);
const dist = (i, j) => largo(sub(atomos[j].p, atomos[i].p));
const vecinos = (i) => enlaces.filter((e) => !e.roto && (e.a === i || e.b === i)).map((e) => (e.a === i ? e.b : e.a));

function prepararMolecula(datos) {
  original = datos;
  // grado de cada átomo (para nombrar enlaces y saber cuál es el átomo central)
  const grado = datos.atomos.map((_, i) => datos.enlaces.filter((e) => e.a === i || e.b === i).length);
  atomos = datos.atomos.map((a, i) => ({ el: a.el, ...aspecto(a.el), esH: a.el === 'H', grado: grado[i],
    p: { x: a.x, y: a.y, z: a.z }, v: { x: 0, y: 0, z: 0 }, agarrado: null }));
  enlaces = datos.enlaces.map((e) => {
    const A = datos.atomos[e.a], B = datos.atomos[e.b];
    const par = [A.el, B.el].sort();
    let De = ENERGIAS[`${par[0]}-${par[1]}${e.orden}`];
    const aprox = De === undefined;
    if (aprox) De = 350;
    // C=O del CO₂ (carbono con dos dobles enlaces a oxígeno): 799 kJ/mol
    if (par[0] === 'C' && par[1] === 'O' && e.orden === 2) {
      const c = A.el === 'C' ? e.a : e.b;
      if (datos.enlaces.filter((x) => x.orden === 2 && (x.a === c || x.b === c) && datos.atomos[x.a === c ? x.b : x.a].el === 'O').length === 2) De = 799;
    }
    // nombre: primero el átomo que no es H (o el de más enlaces)
    const primero = A.el === 'H' && B.el !== 'H' ? B : B.el === 'H' && A.el !== 'H' ? A : grado[e.a] >= grado[e.b] ? A : B;
    const segundo = primero === A ? B : A;
    const re = Math.hypot(A.x - B.x, A.y - B.y, A.z - B.z);
    return { ...e, re, De, aprox, alfa: ALFA[e.orden], roto: false, nombre: `${primero.el}${SIMBOLO_ORDEN[e.orden]}${segundo.el}` };
  });
  // ángulos: cada par de vecinos de un mismo átomo, con el ángulo de la geometría original
  angulos = [];
  datos.atomos.forEach((_, c) => {
    const vs = datos.enlaces.filter((e) => e.a === c || e.b === c).map((e) => (e.a === c ? e.b : e.a));
    for (let i = 0; i < vs.length; i++) for (let j = i + 1; j < vs.length; j++) {
      const u = sub(datos.atomos[vs[i]], datos.atomos[c]), w = sub(datos.atomos[vs[j]], datos.atomos[c]);
      const cos0 = (u.x * w.x + u.y * w.y + u.z * w.z) / (largo(u) * largo(w));
      angulos.push({ c, i: vs[i], j: vs[j], cos0, lineal: cos0 < -0.985 });
    }
  });
  // átomo ancla
  const cen0 = centroide(atomos.map((_, i) => i));
  const maxG = Math.max(...grado);
  ancla = atomos.map((a, i) => i).filter((i) => grado[i] === maxG)
    .sort((i, j) => largo(sub(atomos[i].p, cen0)) - largo(sub(atomos[j].p, cen0)))[0] ?? 0;
  // tamaño de la vista según el tamaño de la molécula (con espacio para estirar)
  const cen = centroide(atomos.map((_, i) => i));
  const R = Math.max(0.5, ...atomos.map((a) => largo(sub(a.p, cen)) + a.radio));
  anchoVista = Math.max(5.2, 2 * R + 3.2);
  crearMallas();
}

function centroide(ids) {
  const s = { x: 0, y: 0, z: 0 };
  ids.forEach((i) => { s.x += atomos[i].p.x; s.y += atomos[i].p.y; s.z += atomos[i].p.z; });
  const n = ids.length || 1;
  return { x: s.x / n, y: s.y / n, z: s.z / n };
}

function reiniciar() {
  const d = original;
  atomos.forEach((a, i) => { a.p = { x: d.atomos[i].x, y: d.atomos[i].y, z: d.atomos[i].z }; a.v = { x: 0, y: 0, z: 0 }; a.agarrado = null; });
  enlaces.forEach((e) => (e.roto = false));
  agarres.clear();
  foco = null;
  zoom = 1; ajustarEscala(); calcularZona();
  // orientación inicial: si la molécula no es plana, se inclina un poco para que se vea en 3D
  const cen = centroide(atomos.map((_, i) => i));
  atomos.forEach((a) => { a.p = sub(a.p, cen); });
  const plana = atomos.every((a) => Math.abs(a.p.z) < 0.05);
  if (!plana) girar(0.35, -0.45, { x: 0, y: 0, z: 0 });
  const c = centroLibre();
  atomos.forEach((a) => { a.p.x += c.x; a.p.y += c.y; });
  reposo = atomos.map((a) => ({ ...a.p }));
  ultimaInteraccion = -1e9;
}

// Zoom: la molécula crece o se achica sin moverse de su lugar en la pantalla
function aplicarZoom(z) {
  z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  if (Math.abs(z - zoom) < 1e-4 || !atomos.length) return;
  const cen = centroide(componente(ancla)), s = aPantalla(cen);
  zoom = z;
  ajustarEscala();
  calcularZona();
  const n = aMundo(s.x, s.y), dx = n.x - cen.x, dy = n.y - cen.y;
  atomos.forEach((a) => { a.p.x += dx; a.p.y += dy; });
  reposo.forEach((r) => { r.x += dx; r.y += dy; });
  ultimaInteraccion = performance.now();
}

// Mover toda la molécula (píxeles de pantalla); su centro no sale de la zona libre
function desplazar(dxPx, dyPx) {
  if (!atomos.length || (!dxPx && !dyPx)) return;
  const cen = centroide(componente(ancla)), m = 0.3;
  let dx = dxPx / pxPorA, dy = -dyPx / pxPorA;
  dx = Math.max(zona.xMin + m - cen.x, Math.min(zona.xMax - m - cen.x, dx));
  dy = Math.max(zona.yMin + m - cen.y, Math.min(zona.yMax - m - cen.y, dy));
  atomos.forEach((a) => { a.p.x += dx; a.p.y += dy; });
  reposo.forEach((r) => { r.x += dx; r.y += dy; });
  ultimaInteraccion = performance.now();
}

// Giro rígido de todas las posiciones alrededor de un punto (ángulos en radianes: ax alrededor de X, ay alrededor de Y)
function girar(ax, ay, centro = centroide(atomos.map((_, i) => i))) {
  const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay);
  const rot = (v) => {
    let { x, y, z } = v;
    [x, z] = [x * cy + z * sy, -x * sy + z * cy];
    [y, z] = [y * cx - z * sx, y * sx + z * cx];
    return { x, y, z };
  };
  atomos.forEach((a) => {
    const q = rot(sub(a.p, centro));
    a.p = { x: q.x + centro.x, y: q.y + centro.y, z: q.z + centro.z };
    a.v = rot(a.v);
  });
  reposo = reposo.map((r) => { const q = rot(sub(r, centro)); return { x: q.x + centro.x, y: q.y + centro.y, z: q.z + centro.z }; });
}

// ============================================================ Física
// Solo el átomo ancla queda quieto (salvo que lo agarres: entonces mueve toda la molécula).
// Los demás sienten los enlaces, los ángulos y una "memoria de forma" suave que los devuelve a su lugar al soltarlos.
// Los pedazos que se separan (enlace roto) quedan libres.
const K_ENLACE = 25, K_ANGULO = 8, K_FORMA = 3, AMORTIGUAR = 5;
function paso(dt) {
  const f = atomos.map(() => ({ x: 0, y: 0, z: 0 }));
  const suma = (i, v, k) => { f[i].x += v.x * k; f[i].y += v.y * k; f[i].z += v.z * k; };
  for (const e of enlaces) {
    if (e.roto) continue;
    const d = sub(atomos[e.b].p, atomos[e.a].p), r = largo(d) || 1e-6;
    const ex = Math.exp(-e.alfa * (r - e.re));
    const F = K_ENLACE * (e.De * e.alfa) / (463 * 2.2) * 2 * (1 - ex) * ex;
    suma(e.a, d, F / r); suma(e.b, d, -F / r);
  }
  for (const g of angulos) {
    if (!enlaceActivo(g.c, g.i) || !enlaceActivo(g.c, g.j)) continue;
    const u = sub(atomos[g.i].p, atomos[g.c].p), w = sub(atomos[g.j].p, atomos[g.c].p);
    const ru = largo(u) || 1e-6, rw = largo(w) || 1e-6;
    const U = { x: u.x / ru, y: u.y / ru, z: u.z / ru }, Wv = { x: w.x / rw, y: w.y / rw, z: w.z / rw };
    const c = U.x * Wv.x + U.y * Wv.y + U.z * Wv.z;
    // lineal: E = k(1 + cosθ); en otro caso: E = k'(cosθ − cosθ₀)² (equivalente a un resorte de ángulo)
    const k = g.lineal ? K_ANGULO : (2 * K_ANGULO / (2 * (1 - g.cos0 * g.cos0))) * (c - g.cos0);
    const dI = { x: (Wv.x - c * U.x) / ru, y: (Wv.y - c * U.y) / ru, z: (Wv.z - c * U.z) / ru };
    const dJ = { x: (U.x - c * Wv.x) / rw, y: (U.y - c * Wv.y) / rw, z: (U.z - c * Wv.z) / rw };
    suma(g.i, dI, -k); suma(g.j, dJ, -k); suma(g.c, dI, k); suma(g.c, dJ, k);
  }
  // repulsión suave entre átomos que no están enlazados ni comparten un ángulo
  for (let i = 0; i < atomos.length; i++) for (let j = i + 1; j < atomos.length; j++) {
    if (enlaceActivo(i, j) || angulos.some((g) => ((g.i === i && g.j === j) || (g.i === j && g.j === i)) && enlaceActivo(g.c, i) && enlaceActivo(g.c, j))) continue;
    const d = sub(atomos[j].p, atomos[i].p), r = largo(d) || 1e-6, min = 1.1;
    if (r < min) { suma(i, d, -30 * (min - r) / r); suma(j, d, 30 * (min - r) / r); }
  }
  const unidos = new Set(componente(ancla));
  atomos.forEach((a, i) => {
    if (unidos.has(i) && reposo[i]) suma(i, sub(reposo[i], a.p), K_FORMA);
  });
  atomos.forEach((a, i) => {
    if (a.agarrado || (i === ancla && !a.agarrado)) { a.v = { x: 0, y: 0, z: 0 }; return; }
    const masa = a.esH ? 1 : 3;
    const am = Math.exp(-AMORTIGUAR * dt);
    a.v.x = (a.v.x + (f[i].x / masa) * dt) * am; a.v.y = (a.v.y + (f[i].y / masa) * dt) * am; a.v.z = (a.v.z + (f[i].z / masa) * dt) * am;
    a.p.x += a.v.x * dt; a.p.y += a.v.y * dt; a.p.z += a.v.z * dt;
    const q = limitar(a, a.p);
    if (q.x !== a.p.x) { a.p.x = q.x; a.v.x *= -0.4; }
    if (q.y !== a.p.y) { a.p.y = q.y; a.v.y *= -0.4; }
    a.p.z = Math.max(-4, Math.min(4, a.p.z));
  });
  for (const e of enlaces) {
    const r = dist(e.a, e.b);
    if (!e.roto && r > e.re + 3.33 / e.alfa) { e.roto = true; avisar(`Enlace ${e.nombre} roto`); }
    else if (e.roto && r < e.re * 1.3) { e.roto = false; avisar(`Enlace ${e.nombre} formado`); }
  }
}
const enlaceActivo = (i, j) => enlaces.some((e) => !e.roto && ((e.a === i && e.b === j) || (e.a === j && e.b === i)));
const limitar = (a, p) => ({
  x: Math.max(zona.xMin + a.radio, Math.min(zona.xMax - a.radio, p.x)),
  y: Math.max(zona.yMin + a.radio, Math.min(zona.yMax - a.radio, p.y)),
  z: p.z,
});
// átomos unidos (por enlaces intactos) al átomo i
function componente(i) {
  const vis = new Set([i]), cola = [i];
  while (cola.length) for (const v of vecinos(cola.pop())) if (!vis.has(v)) { vis.add(v); cola.push(v); }
  return [...vis];
}
const esCentral = (i) => i === ancla && atomos[i].grado > 1;

// ============================================================ Dibujo
let esferas = [], barras = [], etiquetas = [];
function crearMallas() {
  esferas.forEach((m) => escena.remove(m)); barras.forEach((g) => g.forEach((m) => escena.remove(m)));
  $('etiquetas').innerHTML = '';
  esferas = atomos.map((a) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(a.radio, 40, 28),
      new THREE.MeshStandardMaterial({ color: a.color, roughness: 0.35, metalness: 0.05 }));
    escena.add(m);
    return m;
  });
  barras = enlaces.map((e) => Array.from({ length: e.orden }, () => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 18), new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: 0.5 }));
    escena.add(m);
    return m;
  }));
  etiquetas = atomos.map((a) => {
    const d = document.createElement('div');
    d.className = 'etiqueta' + (a.clara ? ' clara' : '');
    d.textContent = a.el;
    $('etiquetas').appendChild(d);
    return d;
  });
}
const gris = new THREE.Color(0x9e9e9e), amarillo = new THREE.Color(0xF5B400), rojo = new THREE.Color(0xD32F2F);
const EJE_Y = new THREE.Vector3(0, 1, 0);
function dibujarMolecula() {
  atomos.forEach((a, i) => {
    esferas[i].position.set(a.p.x, a.p.y, a.p.z);
    esferas[i].scale.setScalar(a.agarrado ? 1.12 : 1);
    const s = aPantalla(a.p);
    etiquetas[i].style.left = s.x + 'px'; etiquetas[i].style.top = s.y + 'px';
    etiquetas[i].style.zIndex = String(Math.round(a.p.z * 100) + 1000);
    // la etiqueta se oculta si el átomo queda detrás de otro
    etiquetas[i].style.opacity = atomos.some((b, j) => j !== i && b.p.z > a.p.z + 0.15 && Math.hypot(b.p.x - a.p.x, b.p.y - a.p.y) < b.radio) ? '0' : '1';
  });
  enlaces.forEach((e, k) => {
    const grupo = barras[k];
    grupo.forEach((m) => (m.visible = !e.roto));
    if (e.roto) return;
    const A = atomos[e.a].p, B = atomos[e.b].p;
    const d = new THREE.Vector3(B.x - A.x, B.y - A.y, B.z - A.z), r = d.length();
    const dir = d.clone().normalize();
    // las barras de un enlace doble/triple se separan de lado (perpendicular al enlace y a la vista)
    let lado = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 0, 1));
    if (lado.lengthSq() < 1e-4) lado = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(1, 0, 0));
    lado.normalize();
    const frac = Math.min(1, morse(e, r) / e.De);
    const color = frac < 0.5 ? gris.clone().lerp(amarillo, frac * 2) : amarillo.clone().lerp(rojo, (frac - 0.5) * 2);
    const grosor = (e.orden === 1 ? 0.1 : e.orden === 2 ? 0.065 : 0.05) * (1 - 0.55 * frac);
    const sep = 0.15;
    grupo.forEach((m, n) => {
      const off = (n - (e.orden - 1) / 2) * sep;
      m.position.set((A.x + B.x) / 2 + lado.x * off, (A.y + B.y) / 2 + lado.y * off, (A.z + B.z) / 2 + lado.z * off);
      m.quaternion.setFromUnitVectors(EJE_Y, dir);
      m.scale.set(grosor, r, grosor);
      m.material.color.copy(color);
    });
  });
  render.render(escena, camara);
}

// ============================================================ Panel: enlaces, ángulo y curva de energía
let foco = null, focoHasta = 0; // átomo agarrado (o el último, por unos segundos)
function enlacesDeInteres() {
  const delFoco = foco === null ? [] : enlaces.filter((e) => e.a === foco || e.b === foco);
  const lista = enlaces.length <= 5 ? enlaces : delFoco.length ? delFoco : enlaces.slice(0, 5);
  return { lista, delFoco };
}
function actualizarPanel() {
  if (foco !== null && !atomos[foco].agarrado && performance.now() > focoHasta) foco = null;
  const { lista, delFoco } = enlacesDeInteres();
  const filas = lista.map((e) => {
    const r = dist(e.a, e.b);
    const valor = e.roto ? '<span class="roto">roto</span>' : `${num(r)} Å · ${Math.round(morse(e, r))} kJ/mol`;
    return `<div class="dato${delFoco.includes(e) ? ' foco' : ''}"><b>${e.nombre}</b><span class="valor">${valor}</span></div>`;
  });
  // ángulos: los del átomo agarrado; si no hay, los del átomo central
  let listaAng = angulos.filter((g) => enlaceActivo(g.c, g.i) && enlaceActivo(g.c, g.j));
  if (foco !== null) listaAng = listaAng.filter((g) => g.c === foco || g.i === foco || g.j === foco);
  else { const c = atomos.findIndex((_, i) => esCentral(i)); listaAng = listaAng.filter((g) => g.c === c); }
  if (listaAng.length) {
    const vals = listaAng.map((g) => {
      const u = sub(atomos[g.i].p, atomos[g.c].p), w = sub(atomos[g.j].p, atomos[g.c].p);
      return (Math.acos(Math.max(-1, Math.min(1, (u.x * w.x + u.y * w.y + u.z * w.z) / (largo(u) * largo(w))))) * 180) / Math.PI;
    });
    const g0 = listaAng[0];
    const nombre = `${atomos[g0.i].el}–${atomos[g0.c].el}–${atomos[g0.j].el}`;
    const iguales = Math.max(...vals) - Math.min(...vals) < 0.6;
    const min = Math.min(...vals), max = Math.max(...vals);
    const texto = iguales ? `${num(vals[0], 1)}°${vals.length > 1 ? ` (×${vals.length})` : ''}`
      : vals.length === 2 ? vals.map((v) => num(v, 1) + '°').join(' · ') : `${num(min, 1)}–${num(max, 1)}°`;
    filas.push(`<div class="dato"><b>Ángulo ${nombre}</b><span class="valor">${texto}</span></div>`);
  } else if (angulos.length) {
    filas.push(`<div class="dato"><b>Ángulo</b><span class="valor">—</span></div>`);
  }
  $('datos').innerHTML = filas.join('');
  dibujarGrafica(delFoco);
}

function dibujarGrafica(delFoco) {
  const g = $('grafica'), c = g.getContext('2d'), k = devicePixelRatio;
  const w = g.width / k, h = g.height / k;
  c.setTransform(k, 0, 0, k, 0, 0);
  c.clearRect(0, 0, w, h);
  // enlace que se grafica: el más estirado entre los del átomo agarrado (o entre todos)
  const candidatos = (delFoco.length ? delFoco : enlaces).filter((e) => !e.roto);
  const e0 = candidatos.sort((a, b) => morse(b, dist(b.a, b.b)) - morse(a, dist(a.a, a.b)))[0] || enlaces[0];
  if (!e0) return;
  const rMin = e0.re * 0.6, rMax = e0.re + 3.33 / e0.alfa + 0.4, vMax = e0.De * 1.25;
  const m = { l: 26, r: 6, t: 14, b: 26 };
  const X = (r) => m.l + ((r - rMin) / (rMax - rMin)) * (w - m.l - m.r);
  const Y = (v) => h - m.b - (Math.min(v, vMax) / vMax) * (h - m.t - m.b);
  c.strokeStyle = '#555'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(m.l, m.t - 4); c.lineTo(m.l, h - m.b); c.lineTo(w - m.r, h - m.b); c.stroke();
  c.setLineDash([3, 3]); c.strokeStyle = '#B22318';
  c.beginPath(); c.moveTo(m.l, Y(e0.De)); c.lineTo(w - m.r, Y(e0.De)); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#B22318'; c.font = '700 9px system-ui'; c.textAlign = 'right';
  c.fillText(`${e0.aprox ? '≈ ' : ''}${e0.De} kJ/mol`, w - m.r, Y(e0.De) - 3);
  c.strokeStyle = '#1B2F6E'; c.lineWidth = 2; c.beginPath();
  for (let i = 0; i <= 80; i++) { const r = rMin + (i / 80) * (rMax - rMin); i ? c.lineTo(X(r), Y(morse(e0, r))) : c.moveTo(X(r), Y(morse(e0, r))); }
  c.stroke();
  const rRup = e0.re + 3.33 / e0.alfa;
  c.strokeStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.moveTo(X(rRup), m.t); c.lineTo(X(rRup), h - m.b); c.stroke();
  // puntos: todos los enlaces del mismo tipo; el graficado, más grande
  for (const e of enlaces) {
    if (e.roto || e.nombre !== e0.nombre) continue;
    const r = Math.min(dist(e.a, e.b), rMax);
    c.fillStyle = e === e0 ? '#1B2F6E' : '#8FA3C7';
    c.beginPath(); c.arc(X(r), Y(morse(e, r)), e === e0 ? 5 : 3.5, 0, 2 * Math.PI); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke();
  }
  c.fillStyle = '#333'; c.font = '600 9px system-ui'; c.textAlign = 'center';
  c.fillText(`distancia ${e0.nombre} (Å)`, (m.l + w - m.r) / 2, h - 3);
  c.save(); c.translate(9, (m.t + h - m.b) / 2); c.rotate(-Math.PI / 2); c.fillText('energía', 0, 0); c.restore();
  c.fillStyle = '#555';
  for (let r = Math.ceil(rMin); r <= rMax; r++) c.fillText(String(r), X(r), h - m.b + 10);
}

// ============================================================ Agarrar átomos o girar (manos y dedos)
const agarres = new Map(); // id → { tipo: 'atomo' | 'girar', atomo?, x, y, px?, py? }
let ultimaInteraccion = -1e9;
function atomoCercano(x, y) {
  let mejor = -1, mejorZ = -Infinity, dMejor = Infinity;
  atomos.forEach((a, i) => {
    if (a.agarrado) return;
    const s = aPantalla(a.p);
    const d = Math.hypot(s.x - x, s.y - y);
    const alcance = Math.max(44, a.radio * pxPorA * 1.7);
    // si hay varios cerca, gana el que está más adelante (más cerca de la cámara)
    if (d < alcance && (a.p.z > mejorZ + 0.3 || (Math.abs(a.p.z - mejorZ) <= 0.3 && d < dMejor))) { mejor = i; mejorZ = a.p.z; dMejor = d; }
  });
  return mejor;
}
function agarrar(id, x, y, soloAtomos = false) {
  ultimaInteraccion = performance.now();
  const i = atomoCercano(x, y);
  if (i >= 0) {
    agarres.set(id, { tipo: 'atomo', atomo: i, x, y });
    atomos[i].agarrado = id;
    foco = i;
  } else if (!soloAtomos) {
    // dedo en un espacio vacío: un dedo gira, dos dedos hacen zoom
    agarres.set(id, { tipo: 'girar', x, y, px: x, py: y });
  }
}
function mover(id, x, y) {
  const g = agarres.get(id);
  if (!g) return;
  g.x = x; g.y = y;
  ultimaInteraccion = performance.now();
}
function soltar(id) {
  const g = agarres.get(id);
  if (!g) return;
  if (g.tipo === 'atomo') { atomos[g.atomo].agarrado = null; focoHasta = performance.now() + 4000; }
  agarres.delete(id);
  ultimaInteraccion = performance.now();
}
function aplicarAgarres() {
  const giros = [...agarres.values()].filter((g) => g.tipo === 'girar');
  if (giros.length >= 2) {
    const [a, b] = giros;
    const d = Math.hypot(a.x - b.x, a.y - b.y), dAntes = Math.hypot(a.px - b.px, a.py - b.py);
    if (dAntes > 10) aplicarZoom(zoom * (d / dAntes));
    desplazar((a.x + b.x - a.px - b.px) / 2, (a.y + b.y - a.py - b.py) / 2);
  } else if (giros.length === 1) {
    const g = giros[0], dx = g.x - g.px, dy = g.y - g.py;
    if (dx || dy) girar(dy * 0.012, dx * 0.012);
  }
  giros.forEach((g) => { g.px = g.x; g.py = g.y; });
  for (const g of agarres.values()) {
    if (g.tipo !== 'atomo') continue;
    const a = atomos[g.atomo];
    const obj = aMundo(g.x, g.y);
    const n = limitar(a, { x: obj.x, y: obj.y, z: a.p.z });
    if (esCentral(g.atomo)) {
      // el átomo central arrastra todo lo que está unido a él
      const dx = n.x - a.p.x, dy = n.y - a.p.y;
      for (const j of componente(g.atomo)) if (j !== g.atomo && !atomos[j].agarrado) { atomos[j].p.x += dx; atomos[j].p.y += dy; }
      reposo.forEach((r) => { r.x += dx; r.y += dy; });
    }
    a.p.x = n.x; a.p.y = n.y;
  }
}

lienzo.addEventListener('pointerdown', (ev) => {

let detector = null, ultimoTiempoVideo = -1;
async function cargarDetector() {
  estado('Cargando el detector de manos…');
  try {
    const { FilesetResolver, HandLandmarker } = await import(`${MEDIAPIPE}/vision_bundle.mjs`);
    const archivos = await FilesetResolver.forVisionTasks(`${MEDIAPIPE}/wasm`);
    const opciones = (delegate) => ({
      baseOptions: { modelAssetPath: MODELO_MANOS, delegate }, runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
    });
    try { detector = await HandLandmarker.createFromOptions(archivos, opciones('GPU')); }
    catch { detector = await HandLandmarker.createFromOptions(archivos, opciones('CPU')); }
    estado('');
  } catch (e) {
    console.warn(e);
    detector = null;
    estado('Detector de manos no disponible: usa el dedo');
  }
}
function puntoPantalla(l) {
  const vw = video.videoWidth || W, vh = video.videoHeight || H;
  const esc = Math.max(W / vw, H / vh);
  let x = l.x * vw * esc + (W - vw * esc) / 2;
  const y = l.y * vh * esc + (H - vh * esc) / 2;
  if (modoCamara === 'user') x = W - x;
  return { x, y };
}
// Umbrales de los gestos (se pueden ajustar)
const GESTO = {
  pinza: 0.32, soltarPinza: 0.5,  // distancia pulgar–índice ÷ tamaño de la mano
  estirado: 1.15, doblado: 1.0,   // distancia punta–muñeca ÷ distancia articulación–muñeca
  cuadros: 3,                     // cuadros seguidos para aceptar un gesto (evita saltos)
  giro: 0.012,                    // radianes por píxel al girar con el puño
  zoom: 1.5,                      // sensibilidad del zoom al acercar/alejar la mano
};
// Clasifica la mano: 'puno' (todos los dedos doblados), 'paz' (índice y medio estirados, anular y meñique doblados)
// o 'senalar' (solo el índice estirado)
function clasificarMano(P) {
  const d = (a, b) => Math.hypot(P[a].x - P[b].x, P[a].y - P[b].y);
  const razon = [[8, 6], [12, 10], [16, 14], [20, 18]].map(([punta, art]) => d(punta, 0) / (d(art, 0) || 1));
  const estirado = razon.map((x) => x > GESTO.estirado), doblado = razon.map((x) => x < GESTO.doblado);
  if (doblado.every(Boolean) && razon[0] < GESTO.doblado - 0.05) return 'puno';
  if (estirado[0] && estirado[1] && doblado[2] && doblado[3]) return 'paz';
  if (estirado[0] && doblado[1] && doblado[2] && doblado[3]) return 'senalar';
  return null;
}
let manosPrevias = [], siguienteId = 0;
function procesarManos(listas) {
  const nuevas = listas.map((lms) => {
    const P = lms.map(puntoPantalla);
    const tam = Math.hypot(P[0].x - P[9].x, P[0].y - P[9].y) || 1;
    return { apertura: Math.hypot(P[4].x - P[8].x, P[4].y - P[8].y) / tam, punto: { x: (P[4].x + P[8].x) / 2, y: (P[4].y + P[8].y) / 2 },
      centro: P[9], tam, candidato: clasificarMano(P) };
  });
  const usadas = new Set();
  const suave = (a, b, k = 0.55) => ({ x: a.x * (1 - k) + b.x * k, y: a.y * (1 - k) + b.y * k });
  const actuales = nuevas.map((m) => {
    let previa = null, dMin = Infinity;
    for (const p of manosPrevias) {
      if (usadas.has(p.id)) continue;
      const d = Math.hypot(p.centro.x - m.centro.x, p.centro.y - m.centro.y);
      if (d < dMin && d < 250) { dMin = d; previa = p; }
    }
    if (previa) usadas.add(previa.id);
    const id = previa ? previa.id : 'mano' + siguienteId++;
    // gesto estable: el candidato debe repetirse varios cuadros seguidos
    const cuenta = previa && previa.candidato === m.candidato ? previa.cuenta + 1 : 1;
    const gestoAntes = previa ? previa.gesto : null;
    const gesto = cuenta >= GESTO.cuadros ? m.candidato : gestoAntes;
    const antes = previa ? previa.pinza : false;
    const pinza = gesto === 'puno' ? false : antes ? m.apertura < GESTO.soltarPinza : m.apertura < GESTO.pinza;
    return {
      id, centro: m.centro, candidato: m.candidato, cuenta, gesto, gestoAntes, pinza, nueva: pinza && !antes,
      punto: previa ? suave(previa.punto, m.punto) : m.punto,
      centroSuave: previa ? suave(previa.centroSuave, m.centro, 0.5) : m.centro,
      centroSuaveAntes: previa ? previa.centroSuave : null,
      tamSuave: previa ? previa.tamSuave * 0.6 + m.tam * 0.4 : m.tam,
      tam0: previa ? previa.tam0 : m.tam, zoom0: previa ? previa.zoom0 : zoom,
    };
  });
  for (const p of manosPrevias) if (!actuales.some((a) => a.id === p.id)) soltar(p.id);
  for (const m of actuales) {
    if (m.gesto === 'puno') {
      // ✊ girar: la molécula sigue el movimiento del puño
      soltar(m.id);
      if (m.gestoAntes === 'puno' && m.centroSuaveAntes) {
        const dx = m.centroSuave.x - m.centroSuaveAntes.x, dy = m.centroSuave.y - m.centroSuaveAntes.y;
        if (dx || dy) girar(dy * GESTO.giro, dx * GESTO.giro);
      }
      ultimaInteraccion = performance.now();
    } else if (m.gesto === 'senalar' && !m.pinza) {
      // ☝️ mover: la molécula sigue a la mano (arriba, abajo, a los lados)
      soltar(m.id);
      if (m.gestoAntes === 'senalar' && m.centroSuaveAntes)
        desplazar(m.centroSuave.x - m.centroSuaveAntes.x, m.centroSuave.y - m.centroSuaveAntes.y);
      ultimaInteraccion = performance.now();
    } else if (m.gesto === 'paz' && !m.pinza) {
      // ✌️ zoom: acercar la mano a la cámara agranda la molécula
      soltar(m.id);
      if (m.gestoAntes !== 'paz') { m.tam0 = m.tamSuave; m.zoom0 = zoom; }
      else aplicarZoom(m.zoom0 * (m.tamSuave / m.tam0) ** GESTO.zoom);
      ultimaInteraccion = performance.now();
    } else if (m.nueva) agarrar(m.id, m.punto.x, m.punto.y, true);
    else if (m.pinza) mover(m.id, m.punto.x, m.punto.y);
    else soltar(m.id);
  }
  manosPrevias = actuales;
  dibujarManos(actuales);
}
// Íconos dentro del círculo: girar (flecha circular), mover (cruz de flechas), zoom (±)
function dibujarIcono(c, gesto, x, y) {
  c.save();
  c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 2.5; c.lineCap = 'round'; c.lineJoin = 'round';
  const punta = (px, py, ang) => {
    c.beginPath();
    c.moveTo(px + 6 * Math.cos(ang + 2.5), py + 6 * Math.sin(ang + 2.5));
    c.lineTo(px, py);
    c.lineTo(px + 6 * Math.cos(ang - 2.5), py + 6 * Math.sin(ang - 2.5));
    c.stroke();
  };
  if (gesto === 'puno') {
    c.beginPath(); c.arc(x, y, 10, -Math.PI * 0.2, Math.PI * 1.4); c.stroke();
    const a = Math.PI * 1.4;
    punta(x + 10 * Math.cos(a), y + 10 * Math.sin(a), a + Math.PI / 2);
  } else if (gesto === 'senalar') {
    c.beginPath(); c.moveTo(x - 12, y); c.lineTo(x + 12, y); c.moveTo(x, y - 12); c.lineTo(x, y + 12); c.stroke();
    punta(x + 12, y, 0); punta(x - 12, y, Math.PI); punta(x, y - 12, -Math.PI / 2); punta(x, y + 12, Math.PI / 2);
  } else {
    c.font = '800 22px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('±', x, y + 1);
  }
  c.restore();
}
// Indicadores: circulito de la pinza (amarillo al sujetar un átomo); íconos al girar, mover o hacer zoom
function dibujarManos(manos) {
  const c = $('manos').getContext('2d'), k = devicePixelRatio;
  c.setTransform(k, 0, 0, k, 0, 0);
  c.clearRect(0, 0, W, H);
  for (const m of manos) {
    c.lineWidth = 3;
    if (m.gesto === 'puno' || ((m.gesto === 'paz' || m.gesto === 'senalar') && !m.pinza)) {
      const p = m.centroSuave;
      c.strokeStyle = '#ffffff'; c.fillStyle = 'rgba(27,47,110,.55)';
      c.beginPath(); c.arc(p.x, p.y, 24, 0, 2 * Math.PI); c.fill(); c.stroke();
      dibujarIcono(c, m.gesto, p.x, p.y);
      continue;
    }
    const g = agarres.get(m.id);
    const sujeta = g && g.tipo === 'atomo';
    c.strokeStyle = m.pinza ? (sujeta ? '#F5B400' : '#ffffff') : 'rgba(255,255,255,.6)';
    c.fillStyle = m.pinza ? (sujeta ? 'rgba(245,180,0,.35)' : 'rgba(255,255,255,.25)') : 'transparent';
    c.beginPath(); c.arc(m.punto.x, m.punto.y, m.pinza ? 16 : 22, 0, 2 * Math.PI); c.fill(); c.stroke();
  }
}

// ============================================================ Foto y video
// Dibuja un cuadro igual a la pantalla: cámara, molécula, etiquetas, logo, nombre y el panel (si está visible).
// No incluye los botones, los avisos ni los indicadores de la mano.
function componer(g, W, H) {
  const fondo = g.createLinearGradient(0, 0, W * 0.4, H);
  fondo.addColorStop(0, '#20414f'); fondo.addColorStop(1, '#0d1b24');
  g.fillStyle = fondo; g.fillRect(0, 0, W, H);
  if (flujo && video.readyState >= 2) IllariCaptura.dibujarVideoCubriendo(g, video, W, H, modoCamara === 'user');
  render.render(escena, camara);
  g.drawImage(lienzo, 0, 0, W, H);
  // símbolos de los átomos
  g.font = '800 7px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  etiquetas.forEach((e, i) => {
    if (e.style.opacity === '0') return;
    const x = parseFloat(e.style.left), y = parseFloat(e.style.top), clara = atomos[i]?.clara;
    g.lineWidth = 2; g.strokeStyle = clara ? '#000' : '#fff'; g.fillStyle = clara ? '#fff' : '#111';
    g.strokeText(e.textContent, x, y); g.fillText(e.textContent, x, y);
  });
  // barra superior: degradado, logo y nombre de la molécula
  const rb = $('barra').getBoundingClientRect();
  const sombra = g.createLinearGradient(0, 0, 0, rb.bottom);
  sombra.addColorStop(0, 'rgba(0,0,0,.45)'); sombra.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sombra; g.fillRect(0, 0, W, rb.bottom);
  const logo = $('logo');
  let xNombre = 10;
  if (logo && logo.complete && logo.naturalWidth) {
    const rl = logo.getBoundingClientRect();
    g.drawImage(logo, rl.left, rl.top, rl.width, rl.height);
    xNombre = rl.right + 8;
  }
  const rt = $('titulo').getBoundingClientRect();
  g.save();
  g.font = '800 17px system-ui, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 3; g.shadowOffsetY = 1; g.fillStyle = '#fff';
  g.fillText($('titulo').textContent, xNombre, rt.top + rt.height / 2, W - xNombre - 12);
  g.restore();
  // panel de datos
  const panel = $('panel');
  if (!panel.classList.contains('oculto')) {
    const rp = panel.getBoundingClientRect();
    g.save();
    g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 8; g.shadowOffsetY = 2;
    g.fillStyle = 'rgba(255,255,255,.86)';
    g.beginPath();
    if (g.roundRect) g.roundRect(rp.left, rp.top, rp.width, rp.height, 16); else g.rect(rp.left, rp.top, rp.width, rp.height);
    g.fill();
    g.restore();
    g.textAlign = 'left'; g.textBaseline = 'middle';
    panel.querySelectorAll('.dato').forEach((fila) => {
      const foco = fila.classList.contains('foco');
      const b = fila.querySelector('b'), v = fila.querySelector('.valor');
      if (b) {
        const r = b.getBoundingClientRect();
        g.font = '800 13px system-ui, sans-serif'; g.fillStyle = foco ? '#1B2F6E' : '#111';
        g.fillText((foco ? '▸ ' : '') + b.textContent, r.left, r.top + r.height / 2);
      }
      if (v) {
        const r = v.getBoundingClientRect(), roto = !!v.querySelector('.roto');
        g.font = (roto ? '800' : '400') + ' 13px system-ui, sans-serif';
        g.fillStyle = roto ? '#B22318' : foco ? '#1B2F6E' : '#111';
        g.fillText(v.textContent, r.left, r.top + r.height / 2, Math.max(20, rp.right - r.left - 8));
      }
    });
    const rg = $('grafica').getBoundingClientRect();
    g.drawImage($('grafica'), rg.left, rg.top, rg.width, rg.height);
  }
}
const nombreArchivo = () => 'illari-' + ((params.get('mol') || 'molecula').replace(/[^a-z0-9-]/gi, '') || 'molecula');
$('btnFoto').onclick = async () => {
  $('flash').style.opacity = 0.8; setTimeout(() => ($('flash').style.opacity = 0), 150);
  try { await IllariCaptura.foto(componer, nombreArchivo()); avisar('Foto guardada en Descargas'); }
  catch (e) { console.warn(e); avisar('No se pudo tomar la foto'); }
};
const grabadora = IllariCaptura.grabadora({
  componer, nombre: nombreArchivo, avisar: (t) => avisar(t, 2200),
  alCambiar: (estado, s) => {
    const b = $('btnGrabar'), r = $('rec');
    const grabando = estado === 'grabando';
    b.classList.toggle('grabando', grabando);
    b.setAttribute('aria-label', grabando ? 'Detener grabación' : 'Grabar video');
    b.title = b.getAttribute('aria-label');
    r.classList.toggle('ver', grabando);
    const t = (n) => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
    if (grabando) r.textContent = `● ${t(s)} / ${t(window.__illariMaxSegundos || IllariCaptura.MAX_SEGUNDOS)}`;
  },
});
$('btnGrabar').onclick = () => grabadora.alternar();

// Para pruebas: manos simuladas y estado
let simulando = null, sinGiro = false;
window.__lab = {
  simularManos: (listas) => { simulando = listas; },
  estado: () => ({
    atomos: atomos.map((a) => ({ el: a.el, ...a.p, agarrado: a.agarrado })),
    enlaces: enlaces.map((e) => ({ nombre: e.nombre, roto: e.roto, r: dist(e.a, e.b), De: e.De })),
    pantalla: atomos.map((a) => ({ ...aPantalla(a.p), z: a.p.z })),
    zoom,
    gestos: manosPrevias.map((m) => m.gesto),
  }),
  aNormalizado: (x, y) => {
    const vw = video.videoWidth || W, vh = video.videoHeight || H;
    const esc = Math.max(W / vw, H / vh);
    if (modoCamara === 'user') x = W - x;
    return { x: (x - (W - vw * esc) / 2) / (vw * esc), y: (y - (H - vh * esc) / 2) / (vh * esc) };
  },
  pausarGiro: (s) => { sinGiro = s; },
};

// ============================================================ Bucle principal
let tAnterior = performance.now(), cuadro = 0;
function bucle(t) {
  const dt = Math.min(0.05, (t - tAnterior) / 1000);
  tAnterior = t;
  if (simulando) procesarManos(simulando);
  else if (detector && video.readyState >= 2 && video.currentTime !== ultimoTiempoVideo) {
    ultimoTiempoVideo = video.currentTime;
    try { procesarManos(detector.detectForVideo(video, t).landmarks || []); } catch (e) { console.warn(e); }
  }
  // giro automático lento cuando nadie está interactuando
  if (!sinGiro && agarres.size === 0 && t - ultimaInteraccion > 2500) girar(0, 0.35 * dt);
  aplicarAgarres();
  for (let i = 0; i < 4; i++) paso(dt / 4);
  aplicarAgarres();
  dibujarMolecula();
  if (cuadro++ % 3 === 0 && !$('panel').classList.contains('oculto')) actualizarPanel();
  requestAnimationFrame(bucle);
}

// ============================================================ Inicio: cargar la molécula
async function cargarMolecula() {
  const id = (params.get('mol') || '').toLowerCase();
  let nombre = params.get('nombre') || '', archivo = params.get('archivo') || '';
  if (!archivo) {
    try {
      const datos = await (await fetch('temas.json', { cache: 'no-cache' })).json();
      const m = (datos.moleculas || []).find((x) => x.id === id);
      if (m) { archivo = m.archivo; nombre = nombre || m.nombre; }
    } catch { /* sin lista: se intenta con el nombre directo */ }
  }
  if (!archivo && id) archivo = `moleculas/${id}.sdf`;
  if (!archivo) throw new Error('No se indicó ninguna molécula.');
  let r;
  try { r = await fetch(archivo, { cache: 'no-cache' }); }
  catch (e) { throw new Error('Esta molécula no está descargada en el celular. Conéctate a internet o, con internet, usa su botón de descarga para usarla sin conexión.'); }
  if (!r.ok) throw new Error('No se encontró el archivo de la molécula.');
  const datos = leerSDF(await r.text());
  return { ...datos, nombre: nombre || datos.nombre || 'Molécula' };
}

medir();
calcularZona();
let iniciado = false;
cargarMolecula().then((datos) => {
  $('titulo').textContent = datos.nombre;
  $('introTitulo').textContent = datos.nombre;
  prepararMolecula(datos);
  medir();
  actualizarPanel();
  calcularZona();
  reiniciar();
  addEventListener('resize', () => { medir(); calcularZona(); });
  let verPanel = true;
  try { verPanel = localStorage.getItem('illari:manos:panel') !== '0'; } catch { /* sin almacenamiento */ }
  if (!verPanel) mostrarPanel(false);
  requestAnimationFrame(bucle);
  const b = $('btnEmpezar');
  b.disabled = false; b.textContent = 'Empezar';
  b.onclick = async () => {
    $('intro').classList.add('oculto');
    if (iniciado) return;
    iniciado = true;
    if (await encenderCamara()) await cargarDetector();
  };
}).catch((e) => fallo('No se pudo abrir la molécula', e.message));
