# Cada vez que subes cambios, convierte los experimentos (Excel + HTML) y la
# Realidad Aumentada (ra.xlsx + modelos) y lo publica en GitHub Pages.
#
# Dos trabajos separados (forma recomendada por GitHub):
#   1. construir: arma la carpeta public/ y la sube como paquete "github-pages"
#   2. publicar:  empieza cuando el paquete ya está completo y lo publica
# Así la publicación nunca busca el paquete antes de tiempo, y un «Re-run» no choca con un paquete anterior.
name: Publicar experimentos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llega un cambio nuevo mientras se publica, se espera (no se cancela a medias)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: |
          pip install openpyxl beautifulsoup4 pillow reportlab
          npm install -g @gltf-transform/cli@4

      # Guarda los modelos ya comprimidos para no repetir el trabajo
      - uses: actions/cache@v4
        with:
          path: .cache-modelos
          key: modelos-${{ github.run_id }}
          restore-keys: modelos-

      - name: Convertir Excel + HTML + modelos
        run: python scripts/convertir.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
