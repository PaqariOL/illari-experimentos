# Cada vez que subes cambios, convierte el Excel y los HTML en paquete.json
# y lo publica en GitHub Pages para que la app lo descargue.
name: Publicar experimentos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install openpyxl beautifulsoup4

      - name: Convertir Excel + HTML
        run: python scripts/convertir.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
